name: bun wildcard-exports symlink repro
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: bun --version (1.3.14, the version this repro targets)
        run: bun --version

      - name: 1) Direct symlinked node_modules, no --preserve-symlinks
        working-directory: consumer
        continue-on-error: true
        run: bun run script.ts

      - name: 2) Direct symlinked node_modules, --preserve-symlinks
        working-directory: consumer
        continue-on-error: true
        run: bun --preserve-symlinks run script.ts

      - name: 3) Real bun install (real package.json dependency, not a manual symlink)
        continue-on-error: true
        run: |
          rm -rf /tmp/real-install && mkdir -p /tmp/real-install
          cp -R consumer-real-install/* /tmp/real-install/
          cd /tmp/real-install
          bun install
          echo "--- node_modules/wildcard-pkg entry ---"
          ls -la node_modules/wildcard-pkg
          bun run script.ts

      - name: 4) bun 1.4.0 side by side (same tree as step 1)
        continue-on-error: true
        run: |
          curl -fsSL https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip -o /tmp/bun140.zip
          unzip -q -o /tmp/bun140.zip -d /tmp/bun140
          /tmp/bun140/bun-linux-x64/bun --version
          cd consumer && /tmp/bun140/bun-linux-x64/bun run script.ts
